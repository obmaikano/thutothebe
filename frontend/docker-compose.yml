version: '3.8'

services:
  app:
    image: 'lesegodiane/thutothebe:v8'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thutothebe-frontend
    ports:
      - "5173:4173"
    networks:
      - thutothebe-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  thutothebe-network:
    driver: bridge