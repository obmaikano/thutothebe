version: '3.8'

services:
  # Spring Boot Backend
  backend:
    image: 'lesegodiane/thutothebe-backend:v3'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thutothebe-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thutothebe
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    networks:
      - thutothebe-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  thutothebe-network:
    driver: bridge 